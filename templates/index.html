<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehradun Pathfinder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Google Fonts - SF Pro Display (fallback to Roboto) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Map Container -->
        <div id="map-container"></div>
        
        <!-- Control Panel -->
        <div class="control-panel shadow-lg">
            <div class="panel-header">
                <h1 class="mb-0">Dehradun Pathfinder</h1>
                <button class="btn collapse-btn" id="collapse-panel">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
            
            <div class="panel-content">
                <div class="form-section">
                    <div class="form-group mb-3">
                        <label for="algorithm-select" class="form-label">Algorithm</label>
                        <select class="form-select shadow-sm" id="algorithm-select">
                            <option value="astar">A* Algorithm</option>
                            <option value="dijkstra">Dijkstra's Algorithm</option>
                            <option value="gbfs">Greedy Best-First Search</option>
                        </select>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary shadow-sm" id="set-start-btn">
                            <i class="fa-solid fa-location-dot me-2"></i>Set Start
                        </button>
                        <button class="btn btn-danger shadow-sm" id="set-end-btn">
                            <i class="fa-solid fa-flag-checkered me-2"></i>Set End
                        </button>
                        <button class="btn btn-success shadow-sm" id="find-path-btn" disabled>
                            <i class="fa-solid fa-route me-2"></i>Find Path
                        </button>
                        <button class="btn btn-secondary shadow-sm" id="reset-btn">
                            <i class="fa-solid fa-trash me-2"></i>Clear
                        </button>
                    </div>
                </div>
                
                <div class="metrics-section" id="metrics-container">
                    <h3 class="section-title">Route Metrics</h3>
                    <div class="metrics-content" id="metrics-content">
                        <div class="metric-item">
                            <span class="metric-label">Distance:</span>
                            <span class="metric-value" id="distance-value">-</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">Estimated Time:</span>
                            <span class="metric-value" id="time-value">-</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress route-progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" 
                                     id="route-progress-bar" 
                                     role="progressbar" 
                                     aria-valuenow="0" 
                                     aria-valuemin="0" 
                                     aria-valuemax="100" 
                                     style="width: 0%">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <small id="progress-start">Start</small>
                                <small id="progress-percentage">0%</small>
                                <small id="progress-end">End</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Animation Controls -->
        <div class="animation-controls shadow-sm" id="animation-controls">
            <button class="btn btn-primary btn-sm" id="play-animation-btn">
                <i class="fa-solid fa-play"></i>
            </button>
            <button class="btn btn-primary btn-sm" id="pause-animation-btn">
                <i class="fa-solid fa-pause"></i>
            </button>
            <button class="btn btn-primary btn-sm" id="reset-animation-btn">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <div class="animation-speed">
                <label for="animation-speed-control">Speed</label>
                <input type="range" id="animation-speed-control" min="1" max="10" value="5" class="form-range">
            </div>
        </div>
        
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Calculating route...</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pathfinding.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/metrics.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the application
            initMap();
            initPathfinding();
            initAnimation();
            initMetrics();
            
            // Control panel collapse functionality
            const collapseBtn = document.getElementById('collapse-panel');
            const controlPanel = document.querySelector('.control-panel');
            
            collapseBtn.addEventListener('click', function() {
                controlPanel.classList.toggle('collapsed');
                collapseBtn.querySelector('i').classList.toggle('fa-chevron-down');
                collapseBtn.querySelector('i').classList.toggle('fa-chevron-up');
            });
        });
    </script>
</body>
</html>
